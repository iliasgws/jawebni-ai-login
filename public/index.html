<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Jawebni · Accès</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div class="center-screen">
      <main class="card panel">
        <a class="brand brand-card" href="/" style="margin-bottom: 18px">
          <img class="brand-logo" src="/logo.png" alt="Jawebni" width="1208" height="594" />
        </a>
        <h1>Saisissez votre code d'accès</h1>
        <p class="muted" style="margin: 6px 0 20px; font-size: var(--fs-ui)">
          Le code vous a été transmis par notre équipe après votre commande.
        </p>
        <form id="tokenForm" novalidate>
          <label class="field" for="token">Code d'accès</label>
          <input
            type="text"
            id="token"
            autocomplete="off"
            spellcheck="false"
            autocapitalize="characters"
            aria-describedby="tokenError"
            required
          />
          <div class="field-error hidden" id="tokenError"></div>
          <button class="btn primary" type="submit" style="width: 100%; margin-top: 16px">
            Voir mes identifiants
          </button>
        </form>
      </main>
    </div>
    <script type="module" src="/gate.js"></script>
  </body>
</html>
